{% extends "invitation/base_invitation.html" %}
{% block inv_content %}
<div class="el-card el-card-body text-center p-5">
  <span class="icon-bubble warning lg mb-3"><i class="bi bi-calendar-x"></i></span>
  <h1 class="h5 fw-bold text-primary">Les réponses sont closes</h1>
  <p class="text-muted">{% if event.status == 'cancelled' %}Cet événement a été annulé.{% else %}Cet événement n'accepte plus de réponses.{% endif %}</p>
  <a href="{% url 'events:explore' %}" class="btn btn-primary">Voir les événements publics</a>
</div>
{% endblock %}
