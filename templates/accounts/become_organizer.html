{% extends "base.html" %}
{% block title %}Devenir Organisateur VIP{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:720px">
    <div class="el-card el-card-body text-center p-5">
      <span class="icon-bubble gold lg mb-3"><i class="bi bi-gem"></i></span>
      <h1 class="h3 fw-bold text-primary">Devenir Organisateur VIP</h1>
      <p class="text-muted">Le statut Organisateur est un accès payant. Une fois le paiement confirmé, votre badge VIP s'affiche et le portail Organisateur s'ouvre.</p>
      <form method="post">{% csrf_token %}<button class="btn btn-primary btn-lg">Continuer vers le paiement<i class="bi bi-arrow-right ms-2"></i></button></form>
    </div>
  </div>
</section>
{% endblock %}
