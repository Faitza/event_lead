{% load i18n static %}<!DOCTYPE html>
{% comment %}Page d'erreur autonome : aucune requête à la base, aucun processeur de contexte (elle doit s'afficher même quand le site a un problème).{% endcomment %}
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | EventLead</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="64x64" href="{% static 'img/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #f6eef7; color: #2a1433; font-family: "Jost", "Segoe UI", Arial, sans-serif; }
    .card { max-width: 520px; background: #fff; border: 1px solid #e3d3e8; border-radius: 18px; padding: 36px 28px;
      text-align: center; box-shadow: 0 12px 40px rgba(69, 6, 92, .12); }
    .mark { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center;
      justify-content: center; background: #45065C; color: #E9C46A; font: 700 28px Georgia, serif; }
    h1 { font: 700 26px "Old Standard TT", Georgia, serif; color: #45065C; margin: 0 0 12px; }
    p { font-size: 17px; line-height: 1.55; margin: 0 0 22px; color: #3d2547; }
    a.btn { display: inline-block; background: #45065C; color: #fff; text-decoration: none; padding: 12px 22px;
      border-radius: 12px; font-weight: 600; margin: 4px; }
    a.btn.light { background: #fff; color: #45065C; border: 1px solid #45065C; }
    small { display: block; margin-top: 18px; color: #6b5573; font-size: 14px; }
    small a { color: #45065C; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark">{% block mark %}!{% endblock %}</div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
